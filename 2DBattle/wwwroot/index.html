<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>2D Battle</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" />
    <style>
        html, body { margin: 0; height: 100%; overflow: hidden; background: #000; color: #fff; font-family: "Press Start 2P", monospace; user-select: none; -webkit-user-select: none; touch-action: none; }
        #app { height: 100%; }
        .scene { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
        .scene canvas { display: block; image-rendering: pixelated; image-rendering: crisp-edges; }
        .version { position: fixed; top: calc(8px + env(safe-area-inset-top)); right: calc(12px + env(safe-area-inset-right)); z-index: 40; font-size: 11px; opacity: .9; text-shadow: 2px 2px 0 #000; }
        .hud { position: fixed; top: calc(8px + env(safe-area-inset-top)); left: calc(12px + env(safe-area-inset-left)); z-index: 10; font-size: 11px; line-height: 1.8; text-shadow: 2px 2px 0 #000; }
        .health { width: 160px; height: 10px; margin: 2px 0 4px; border: 2px solid #fff; background: rgba(0,0,0,.5); }
        .health-bar { height: 100%; background: #4c4; transition: width .2s; }
        .health-bar.boost { background: #ffd23f; }
        .overlay { position: fixed; inset: 0; z-index: 30; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 16px; background: rgba(0,0,0,.6); }
        .overlay.banner { background: none; pointer-events: none; text-shadow: 3px 3px 0 #000; }
        .overlay h1 { margin: 0 0 18px; font-size: 36px; letter-spacing: 3px; color: #ffd23f; text-shadow: 4px 4px 0 #a83232; }
        .overlay button { margin-top: 24px; padding: 12px 30px; font: inherit; font-size: 16px; border: 0; background: #3c8d3c; color: #fff; cursor: pointer; box-shadow: 4px 4px 0 #1c4d1c; }
        .controls { font-size: 11px; line-height: 2.2; opacity: .95; }
        .touch { position: fixed; left: 0; right: 0; bottom: calc(14px + env(safe-area-inset-bottom)); z-index: 15; display: none; justify-content: space-between; align-items: flex-end; padding: 0 calc(16px + env(safe-area-inset-right)) 0 calc(16px + env(safe-area-inset-left)); pointer-events: none; }
        @media (pointer: coarse) { .touch { display: flex; } }
        .touch .pad, .touch .actions { display: flex; gap: 8px; align-items: flex-end; pointer-events: auto; }
        .touch button { width: 60px; height: 60px; background: rgba(255,255,255,.18); border: 2px solid rgba(255,255,255,.5); color: #fff; font: inherit; font-size: 18px; touch-action: none; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; }
        .touch .jump { background: rgba(60,140,60,.5); }
        .touch .fire { width: 84px; height: 84px; border-radius: 50%; background: rgba(220,60,40,.55); font-size: 12px; }
        .rotate { display: none; position: fixed; inset: 0; z-index: 60; background: #000; flex-direction: column; align-items: center; justify-content: center; text-align: center; font-size: 14px; padding: 24px; }
        .rotate span { font-size: 64px; margin-bottom: 16px; }
        @media (pointer: coarse) and (orientation: portrait) { .rotate { display: flex; } }
        @media (max-height: 500px), (max-width: 600px) {
            .hud { font-size: 8px; }
            .health { width: 100px; height: 7px; }
            .version { font-size: 8px; }
            .overlay h1 { font-size: 22px; }
            .overlay button { margin-top: 14px; font-size: 12px; }
            .controls { font-size: 8px; line-height: 2; }
            .touch button { width: 50px; height: 50px; }
            .touch .fire { width: 70px; height: 70px; }
        }
        #blazor-error-ui { display: none; position: fixed; left: 0; right: 0; bottom: 0; z-index: 50; padding: 8px 12px; background: #b32121; font-size: 11px; }
        #blazor-error-ui .dismiss { float: right; cursor: pointer; }
    </style>
    <script type="importmap"></script>
    <script>
        // Auto-update + recovery from stale cached HTML (GitHub Pages caches ~10 min)
        (function () {
            const KEY = 'db-recover';
            function reloadFresh(param, value) {
                const url = new URL(location.href);
                url.searchParams.set(param, value);
                location.replace(url.toString());
            }
            function recover() {
                const n = parseInt(sessionStorage.getItem(KEY) || '0', 10);
                if (n >= 2) return;
                sessionStorage.setItem(KEY, String(n + 1));
                reloadFresh('r', Date.now());
            }
            window.gameRecover = recover;
            const watchdog = setTimeout(recover, 45000);
            let current = null;
            async function check() {
                if (!current) return;
                try {
                    const res = await fetch('version.json?t=' + Date.now(), { cache: 'no-store' });
                    if (!res.ok) return;
                    const data = await res.json();
                    if (data.version && data.version !== current) reloadFresh('v', data.version);
                } catch { }
            }
            window.gameUpdater = {
                start(version) {
                    current = version;
                    clearTimeout(watchdog);
                    sessionStorage.removeItem(KEY);
                    check();
                    setInterval(check, 60000);
                    document.addEventListener('visibilitychange', () => { if (!document.hidden) check(); });
                    window.addEventListener('focus', check);
                }
            };
        })();
    </script>
</head>
<body>
    <div id="app"></div>
    <div id="blazor-error-ui">
        Er is een fout opgetreden. <a href="." class="reload">Herladen</a>
        <span class="dismiss">✕</span>
    </div>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js" onerror="gameRecover()"></script>
</body>
</html>
